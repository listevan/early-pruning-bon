arch:
  H_cycles: 1
  H_layers: 8
  expansion: 4
  halt_exploration_prob: 0.1
  halt_max_steps: 16
  hidden_size: 512
  loss:
    loss_type: stablemax_cross_entropy
    name: losses@ACTLossHead
  name: hrm.hrm_act_v2@HierarchicalReasoningModel_ACTV2
  num_heads: 12
  pos_encodings: rope
  puzzle_emb_ndim: 512
beta1: 0.9
beta2: 0.95
checkpoint_every_eval: true
checkpoint_path: checkpoints/Arc-aug-1000 ACT-torch/HierarchicalReasoningModel_ACTV2
  ludicrous-skunk
data_path: data/arc-aug-1000
epochs: 100000
eval_interval: 10000
eval_save_outputs: []
evaluators:
- name: arc@ARC
global_batch_size: 768
load_checkpoint: null
lr: 0.0001
lr_min_ratio: 1.0
lr_warmup_steps: 2000
project_name: Arc-aug-1000 ACT-torch
puzzle_emb_lr: 0.01
puzzle_emb_weight_decay: 0.1
run_name: HierarchicalReasoningModel_ACTV2 ludicrous-skunk
seed: 0
target_q_update_every: 4
weight_decay: 0.1
