[project]
name = "universal-transformer"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "torchaudio",
    "packaging>=25.0",
    "ninja>=1.13.0",
    "wheel>=0.45.1",
    "setuptools>=80.9.0",
    "setuptools-scm>=9.2.2",
    "flash-attn",
    "numpy>=2.3.5",
    "pydantic>=2.12.5",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
    "wandb>=0.23.1",
    "coolname>=2.2.0",
    "tqdm>=4.67.1",
    "pyyaml>=6.0.3",
    "argdantic>=1.3.3",
    "adam-atan2-pytorch",
    "numba>=0.62.1",
]

# Define the PyTorch index with CUDA 12.8 support
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Force these specific packages to use the PyTorch index
[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.5.4/flash_attn-2.6.3+cu128torch2.9-cp312-cp312-linux_x86_64.whl" }
adam-atan2-pytorch = { git = "https://github.com/lucidrains/adam-atan2-pytorch.git" }
